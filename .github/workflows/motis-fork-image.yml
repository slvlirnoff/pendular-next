# Builds MOTIS from our fork and publishes the image to the GitHub container registry of
# this repository's owner. Runs when the Dockerfile changes (it pins the fork's commit), or by hand.
name: MOTIS fork image

on:
  workflow_dispatch:
  push:
    paths:
      - deploy/Dockerfile.motis-fork
      - .github/workflows/motis-fork-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: motis-fork-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Tag from the fork's commit
        id: tag
        run: |
          ref="$(grep -m1 '^ARG MOTIS_REF=' deploy/Dockerfile.motis-fork | cut -d= -f2 | cut -c1-8)"
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/pendular-motis" >> "$GITHUB_OUTPUT"
          echo "tag=v2.11.4-seg-${ref}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.motis-fork
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}
            ${{ steps.tag.outputs.image }}:fork-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
